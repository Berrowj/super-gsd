<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGSD Cockpit · localhost:7777</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ── Design tokens (sgsd-design-system) ── */
    :root {
      --bg:#07111f; --bg2:#0c1a2f;
      --panel:rgba(255,255,255,0.065); --panel2:rgba(255,255,255,0.10);
      --ink:#f3f7ff; --ink-strong:#ffffff; --ink-muted:#aebbd0; --ink-soft:#7f8ca0;
      --line:rgba(255,255,255,0.16); --line-strong:rgba(255,255,255,0.26);
      --cyan:#67e8f9; --blue:#60a5fa; --violet:#c084fc; --green:#86efac;
      --amber:#facc15; --red:#fb7185; --orange:#fdba74;
      --gold:#b98a2f; --gold-strong:#91661d; --gold-soft:#f2dfb8;
      --green-soft:rgba(134,239,172,0.16); --blue-soft:rgba(96,165,250,0.14);
      --red-soft:rgba(251,113,133,0.16); --violet-soft:rgba(192,132,252,0.14);
      --amber-soft:rgba(250,204,21,0.14); --cyan-soft:rgba(103,232,249,0.10);
      --radius-sm:4px; --radius:8px; --radius-lg:12px;
      --space-1:0.25rem; --space-2:0.5rem; --space-3:0.75rem; --space-4:1rem;
      --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem;
      --sans:'Fira Sans', ui-sans-serif, system-ui, sans-serif;
      --mono:'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      --shadow:0 1px 2px rgba(0,0,0,0.18), 0 10px 30px rgba(0,0,0,0.22);
      --bullet-good:#C8E6C9; --bullet-ok:#FFF9C4; --bullet-bad:#FFCDD2;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    html{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    body{margin:0;min-height:100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(103,232,249,0.14), transparent 36%),
        radial-gradient(circle at 84% 6%, rgba(192,132,252,0.12), transparent 32%),
        linear-gradient(145deg, var(--bg), var(--bg2) 48%, #08101c);
      background-attachment: fixed;
    }

    /* ── Top chrome (mock browser-tab look so it reads as localhost) ── */
    .top-chrome{
      display:flex;align-items:center;gap:var(--space-3);
      padding:var(--space-3) var(--space-4);
      border-bottom:1px solid var(--line);
      background:rgba(7,17,31,0.7);
      backdrop-filter:blur(8px);
      position:sticky;top:0;z-index:5;
      font:500 0.78rem/1 var(--mono);color:var(--ink-soft);
    }
    .top-chrome .url{color:var(--ink-muted)}
    .top-chrome .url b{color:var(--ink);font-weight:600}
    .top-chrome .spacer{flex:1}
    .top-chrome .ev-pill{
      display:inline-flex;align-items:center;gap:var(--space-2);
      padding:0.3rem 0.6rem;border:1px solid var(--line);border-radius:999px;
      font:600 0.7rem/1 var(--sans);letter-spacing:0.04em;
    }
    .top-chrome .ev-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);
      animation:pulse 1.6s ease-in-out infinite}
    .top-chrome .ev-pill.disconnected .dot{background:var(--red);box-shadow:0 0 8px var(--red);animation:none}
    .top-chrome .ev-pill.disconnected{color:var(--red);border-color:rgba(251,113,133,0.4)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

    /* ── Layout ── */
    .cockpit-bento{
      width:min(100% - 2rem, 1180px);
      margin-inline:auto;
      padding-block:var(--space-6);
      display:grid;
      gap:var(--space-4);
    }
    .band{
      border:1px solid var(--line);
      border-radius:var(--radius-lg);
      background:var(--panel);
      box-shadow:var(--shadow);
      padding:var(--space-5);
      position:relative;
    }
    .band-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--space-3);gap:var(--space-3)}
    .band-eyebrow{font:800 0.7rem/1 var(--sans);letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-soft)}
    .band-tick{font:500 0.75rem/1 var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}

    /* ── Band 1 emphasis variants ── */
    .band-1.emph-gold-bar{
      border-left:6px solid var(--gold);
      background:linear-gradient(135deg, rgba(185,138,47,0.12), var(--panel));
    }
    .band-1.emph-cyan-glow{
      border:1px solid rgba(103,232,249,0.35);
      box-shadow:0 0 0 1px rgba(103,232,249,0.18), 0 0 32px rgba(103,232,249,0.18) inset, var(--shadow);
      background:linear-gradient(180deg, rgba(103,232,249,0.06), var(--panel));
    }
    .band-1.emph-gradient{
      background:
        linear-gradient(135deg, rgba(185,138,47,0.16), transparent 38%),
        linear-gradient(225deg, rgba(103,232,249,0.10), transparent 40%),
        var(--panel);
      border-top:1px solid rgba(242,223,184,0.35);
    }
    .band-1.emph-cyan-glow .band-eyebrow{color:var(--cyan)}

    .northstar{display:flex;align-items:center;gap:var(--space-3);margin:0 0 var(--space-3)}
    .northstar-glyph{font-size:1.6rem;color:var(--cyan);text-shadow:0 0 12px rgba(103,232,249,0.5);flex-shrink:0}
    .northstar-message{
      font:800 clamp(1.4rem, 2.5vw, 1.95rem)/1.18 var(--sans);
      color:var(--ink-strong);
      letter-spacing:-0.005em;
      text-shadow:0 0 14px rgba(103,232,249,0.18);
    }
    .northstar-message .stage-tag{font-weight:600;font-size:0.8em;color:var(--amber);margin-left:0.4rem}

    .do-next{display:flex;align-items:center;gap:var(--space-2);margin:0 0 var(--space-3);font-weight:600;color:var(--ink);flex-wrap:wrap}
    .do-next-arrow{color:var(--gold-soft);font-weight:800;font-size:1.1rem}
    .do-next-label{
      display:inline-block;font:800 0.7rem/1 var(--sans);letter-spacing:0.08em;text-transform:uppercase;
      background:var(--panel2);padding:0.3rem 0.55rem;border-radius:999px;color:var(--gold-soft);
      border:1px solid rgba(242,223,184,0.18);
    }
    .do-next-text{font:600 1rem/1.4 var(--sans)}

    .alert{
      display:inline-flex;align-items:center;gap:var(--space-2);
      padding:0.5rem 0.9rem;
      border:1px solid var(--line);
      border-left-width:4px;
      border-radius:var(--radius);
      background:var(--panel);
      font:600 0.92rem/1 var(--sans);
      cursor:pointer;
      transition:transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }
    .alert:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.25)}
    .alert:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
    .palette-tier-accent{border-left-color:var(--cyan);background:var(--cyan-soft);color:var(--cyan)}
    .palette-tier-success{border-left-color:var(--green);background:var(--green-soft);color:var(--green)}
    .palette-tier-attention{border-left-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
    .palette-tier-severe{border-left-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
    .palette-tier-danger{border-left-color:var(--red);background:var(--red-soft);color:var(--red)}
    .palette-tier-done{border-left-color:var(--green);background:var(--green-soft);opacity:0.75}
    .alert-icon{font-size:1.05rem}
    .alert-signal{font-weight:700}
    .alert-detail{color:var(--ink-muted);font-weight:500}
    .alert-more.chip{margin-left:var(--space-2)}

    .alert-list{
      margin-top:var(--space-3);
      display:grid;gap:var(--space-2);
      border-top:1px dashed var(--line);padding-top:var(--space-3);
      animation:fade-down 220ms ease;
    }
    @keyframes fade-down{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    .alert-list-row{
      display:grid;grid-template-columns:8rem 1fr auto;gap:var(--space-3);align-items:center;
      padding:var(--space-2) var(--space-3);border:1px solid var(--line);border-radius:var(--radius);
      background:rgba(255,255,255,0.025);font-size:0.85rem;
    }
    .alert-list-row .alr-sig{font:700 0.78rem/1 var(--mono);color:var(--ink)}
    .alert-list-row .alr-det{color:var(--ink-muted)}

    /* Chips */
    .chip{
      display:inline-flex;align-items:center;gap:0.25rem;
      padding:0.18rem 0.55rem;border:1px solid var(--line);border-radius:999px;
      background:var(--panel2);color:var(--ink-muted);
      font:700 0.7rem/1 var(--sans);white-space:nowrap;letter-spacing:0.02em;
    }
    .chip.palette-tier-attention{border-color:rgba(250,204,21,0.5);color:var(--amber);background:var(--amber-soft)}
    .chip.palette-tier-success{border-color:rgba(134,239,172,0.5);color:var(--green);background:var(--green-soft)}
    .chip.palette-tier-danger{border-color:rgba(251,113,133,0.5);color:var(--red);background:var(--red-soft)}

    /* ── Band 2 ── */
    /* Pipeline: cells (default) */
    .pipeline{list-style:none;padding:0;margin:0 0 var(--space-4);display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    .stage{
      flex:1;padding:var(--space-3) var(--space-2);
      text-align:center;
      border-right:1px solid var(--line);
      background:transparent;
      font:600 0.82rem/1.3 var(--sans);
      position:relative;cursor:default;
      transition:background 200ms ease, transform 200ms ease;
    }
    .stage:last-child{border-right:none}
    .stage-name{font:800 0.78rem/1 var(--sans);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:var(--space-1)}
    .stage-marker{font-size:0.9rem;margin-left:0.25rem;display:inline-block}
    .stage-active .stage-marker{animation:hourglass 2s ease-in-out infinite}
    @keyframes hourglass{0%,100%{transform:rotate(0)}50%{transform:rotate(180deg)}}
    .stage-owner{font:500 0.7rem/1.2 var(--mono);color:var(--ink-soft);margin-bottom:var(--space-1)}
    .stage-sla{font:500 0.68rem/1 var(--mono);color:var(--ink-soft)}
    .stage-done{background:var(--green-soft);color:var(--green)}
    .stage-done .stage-owner,.stage-done .stage-sla{color:rgba(134,239,172,0.7)}
    .stage-active{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}
    .stage-active .stage-owner,.stage-active .stage-sla{color:rgba(250,204,21,0.75)}
    .stage-pending{color:var(--ink-soft)}
    .stage-pending .stage-name{color:var(--ink-muted)}
    .stage-blocked{background:var(--red-soft);color:var(--red)}

    /* Pipeline: arrows */
    .pipeline.style-arrows{border:none;overflow:visible;gap:0;padding:0}
    .pipeline.style-arrows .stage{
      border-right:none;border-radius:0;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%);
      margin-right:-6px;border:1px solid transparent;
    }
    .pipeline.style-arrows .stage:first-child{clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%)}
    .pipeline.style-arrows .stage:last-child{clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 14px 50%);margin-right:0}
    .pipeline.style-arrows .stage-pending{background:rgba(255,255,255,0.03)}

    /* Pipeline: stepper */
    .pipeline.style-stepper{
      border:none;overflow:visible;display:grid;
      grid-template-columns:repeat(5, 1fr);gap:var(--space-2);padding:0;
    }
    .pipeline.style-stepper .stage{
      border:1px solid var(--line);border-radius:var(--radius);
      padding-top:1.6rem;
    }
    .pipeline.style-stepper .stage::before{
      content:attr(data-step);
      position:absolute;top:0.5rem;left:50%;transform:translateX(-50%);
      width:1.4rem;height:1.4rem;border-radius:50%;
      background:var(--panel2);border:1px solid var(--line);
      font:800 0.7rem/1.4rem var(--mono);color:var(--ink-muted);
      text-align:center;
    }
    .pipeline.style-stepper .stage-done::before{background:var(--green-soft);border-color:rgba(134,239,172,0.5);color:var(--green)}
    .pipeline.style-stepper .stage-active::before{background:var(--amber-soft);border-color:rgba(250,204,21,0.5);color:var(--amber)}

    .stage:hover{filter:brightness(1.12)}

    /* Stage tooltip */
    .stage-tt{
      position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
      background:#0b1a2e;border:1px solid var(--line-strong);border-radius:var(--radius);
      padding:var(--space-3);min-width:14rem;z-index:20;
      box-shadow:0 12px 32px rgba(0,0,0,0.45);
      text-align:left;pointer-events:none;
      animation:fade-down 140ms ease;
    }
    .stage-tt::after{
      content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
      border:6px solid transparent;border-top-color:#0b1a2e;
    }
    .stage-tt-row{display:grid;grid-template-columns:5rem 1fr;gap:var(--space-2);font:500 0.75rem/1.3 var(--sans);margin-bottom:0.3rem}
    .stage-tt-row:last-child{margin-bottom:0}
    .stage-tt-row dt{color:var(--ink-soft);font:800 0.66rem/1.3 var(--sans);text-transform:uppercase;letter-spacing:0.05em}
    .stage-tt-row dd{margin:0;color:var(--ink);font-family:var(--mono);font-size:0.78rem}
    .stage-tt-row .ok{color:var(--green)} .stage-tt-row .warn{color:var(--amber)}

    .band-2-cols{display:grid;grid-template-columns:1.25fr 1fr;gap:var(--space-5)}
    @media (max-width: 820px){.band-2-cols{grid-template-columns:1fr}}

    .context-rows{margin:0}
    .context-rows .row{
      display:grid;grid-template-columns:8.5rem 1fr;gap:var(--space-3);
      padding:var(--space-3) 0;
      border-bottom:1px dashed var(--line);
      font-size:0.92rem;
    }
    .context-rows .row:last-child{border-bottom:none}
    .context-rows dt{font:800 0.7rem/1 var(--sans);letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-muted);align-self:center}
    .context-rows dd{margin:0;color:var(--ink);align-self:center;line-height:1.4}
    .context-rows dd.status-ok{color:var(--green);font-weight:700}
    .context-rows dd code{font:500 0.85rem/1 var(--mono);color:var(--cyan);background:var(--cyan-soft);padding:0.1rem 0.35rem;border-radius:var(--radius-sm)}

    .trend-strip{
      display:grid;gap:var(--space-3);padding:var(--space-4);
      background:rgba(255,255,255,0.025);border-radius:var(--radius);border:1px solid var(--line);
      position:relative;
    }
    .trend-strip-label{
      font:800 0.66rem/1 var(--sans);letter-spacing:0.1em;text-transform:uppercase;
      color:var(--ink-soft);margin-bottom:var(--space-1);
    }
    .bullet-row{display:grid;grid-template-columns:5rem 4rem 1fr 5rem;gap:var(--space-3);align-items:center;font-size:0.9rem;position:relative}
    .bullet-label{font:800 0.72rem/1 var(--sans);letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-muted)}
    .bullet-value{font:700 0.95rem/1 var(--mono);color:var(--ink-strong);text-align:right;font-variant-numeric:tabular-nums}
    .bullet-bar-wrap{position:relative;height:14px}
    .bullet-bar{width:100%;height:14px;display:block;border-radius:3px;overflow:hidden}
    .bullet-tier{justify-self:end}

    /* Gauge variant */
    .gauge-row{display:grid;grid-template-columns:repeat(3, 1fr);gap:var(--space-3);align-items:center}
    .gauge-cell{
      display:flex;flex-direction:column;align-items:center;gap:var(--space-1);
      padding:var(--space-3);border:1px solid var(--line);border-radius:var(--radius);
      background:rgba(255,255,255,0.02);
    }
    .gauge-svg{width:84px;height:50px;display:block}
    .gauge-value{font:700 1.05rem/1 var(--mono);color:var(--ink-strong);font-variant-numeric:tabular-nums}
    .gauge-label{font:800 0.66rem/1 var(--sans);letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft)}

    /* Progress variant */
    .prog-row{display:grid;grid-template-columns:5.5rem 1fr 4rem;gap:var(--space-3);align-items:center;font-size:0.9rem;margin-bottom:var(--space-3)}
    .prog-row:last-child{margin-bottom:0}
    .prog-track{height:8px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;position:relative}
    .prog-fill{height:100%;border-radius:999px;transition:width 600ms cubic-bezier(.22,.61,.36,1)}

    /* Bullet tooltip */
    .bullet-tt{
      position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);
      background:#0b1a2e;border:1px solid var(--line-strong);border-radius:var(--radius);
      padding:var(--space-2) var(--space-3);min-width:12rem;z-index:20;
      box-shadow:0 12px 32px rgba(0,0,0,0.45);pointer-events:none;
      font:500 0.74rem/1.4 var(--sans);
      animation:fade-down 140ms ease;
    }
    .bullet-tt b{color:var(--ink);font-weight:700}
    .bullet-tt .tt-line{display:flex;justify-content:space-between;gap:var(--space-3);color:var(--ink-muted)}
    .bullet-tt .tt-line b{color:var(--ink);font-family:var(--mono)}

    /* ── Band 3 ── */
    .band-3-toggle{
      background:transparent;border:1px solid var(--line);color:var(--ink-muted);
      font:700 0.7rem/1 var(--sans);text-transform:uppercase;letter-spacing:0.08em;
      padding:0.4rem 0.8rem;border-radius:var(--radius);cursor:pointer;
      transition:all 180ms ease;min-height:32px;
    }
    .band-3-toggle:hover{color:var(--ink);border-color:var(--line-strong);background:var(--panel2)}
    .band-3-toggle:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

    .rationale-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
    @media (max-width: 800px){.rationale-grid{grid-template-columns:1fr}}
    .rationale-card{
      border:1px solid var(--line);border-radius:var(--radius);background:var(--panel2);
      padding:var(--space-4);
      transition:border-color 180ms ease, transform 180ms ease;
    }
    .rationale-card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
    .rationale-card h3{
      font:800 0.72rem/1 var(--sans);letter-spacing:0.07em;text-transform:uppercase;
      color:var(--gold-soft);margin:0 0 var(--space-2);
      display:flex;align-items:center;gap:var(--space-2);
    }
    .rationale-card h3 .h3-rule{flex:1;height:1px;background:linear-gradient(90deg, rgba(242,223,184,0.3), transparent)}
    .rationale-card p{margin:0;font-size:0.9rem;line-height:1.55;color:var(--ink)}
    .rationale-card p strong{color:var(--cyan);font-weight:700}
    .rationale-evidence{grid-column:1 / -1}
    .rationale-evidence p{font-family:var(--mono);font-size:0.78rem;color:var(--ink-muted);word-break:break-word;line-height:1.7}
    .rationale-evidence code{color:var(--blue);background:rgba(96,165,250,0.10);padding:0.12rem 0.4rem;border-radius:var(--radius-sm);border:1px solid rgba(96,165,250,0.18)}

    /* Band 3 tabs variant */
    .rationale-tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:var(--space-3);flex-wrap:wrap}
    .rationale-tab{
      flex:1;min-width:8rem;padding:var(--space-3);background:transparent;border:none;border-right:1px solid var(--line);
      color:var(--ink-muted);font:800 0.7rem/1 var(--sans);letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;
      transition:all 180ms ease;text-align:left;
    }
    .rationale-tab:last-child{border-right:none}
    .rationale-tab:hover{background:var(--panel2);color:var(--ink)}
    .rationale-tab.active{background:var(--gold-soft);color:#1a120a}
    .rationale-tabpanel{padding:var(--space-4);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel2);min-height:8rem}
    .rationale-tabpanel p{margin:0;font-size:0.92rem;line-height:1.6;color:var(--ink)}

    .tabular{font-variant-numeric:tabular-nums;font-family:var(--mono)}

    /* Loading band */
    .band-loading{
      display:flex;align-items:center;gap:var(--space-2);color:var(--ink-soft);
      font:500 0.85rem/1 var(--mono);
    }
    .band-loading .skel{
      display:inline-block;width:8rem;height:0.8rem;
      background:linear-gradient(90deg, var(--panel) 0%, var(--panel2) 50%, var(--panel) 100%);
      background-size:200% 100%;animation:shimmer 1.4s infinite linear;border-radius:var(--radius-sm);
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      *{animation-duration:0!important;animation-iteration-count:1!important;transition-duration:0!important}
    }
  </style>
</head>
