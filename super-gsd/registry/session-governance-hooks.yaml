# ============================================================================
# SGSD session governance hook routing registry
# ============================================================================
# Compatibility registry for P146 enforcement and quality-hook metadata.
# Prompt-time skill suggestions are maintained only in skill-routing.yaml and
# adapted by scripts/lib/skill-routing-registry.cjs::toPromptGovernanceRoutes.
# Shape: trigger / predicate / enforcement.
# ============================================================================

routes:
  - id: planning-triage
    trigger:
      phrases:
        - "multiple valid approaches"
      regexes:
        - "^\\s*how\\s+should\\s+we\\s+architect(?![._/])\\b\\s+(?:the\\s+|a\\s+|an\\s+|our\\s+)?(?:retry|cache|migration|schema|evidence|gate|classifier|system|layer|roadmap|milestone|phase|architecture|design)\\b"
        - "^\\s*how\\s+would\\s+you\\s+approach\\s+(?:the\\s+|a\\s+|an\\s+|our\\s+)?(?:migration|milestone|phase|plan|implementation|architecture|schema|system|layer|roadmap)\\b"
        - "^\\s*(?:lets|let's)\\s+scope\\s+(?:the\\s+)?(?:next\\s+)?(?:milestone|phase|plan|implementation|project|work)\\b"
        - "^\\s*(?:lets|let's)\\s+plan\\s+(?:the\\s+)?(?:next\\s+)?(?:phase|milestone|implementation|migration|project|work)\\b"
        - "\\bcan\\s+you\\s+(?:make|draft|create)\\s+(?:a\\s+)?roadmap\\s+for\\s+[^\\s]+"
        - "^\\s*what\\s+are\\s+our\\s+options\\s+for\\s+(?:the\\s+|a\\s+|an\\s+|our\\s+)?(?:cache|migration|retry|schema|architecture|system|layer|phase|milestone|design)\\b"
        - "\\bhelp\\s+me\\s+decide\\s+between\\s+(?:the\\s+|these\\s+|those\\s+)?(?:two\\s+)?(?:designs?|approaches?|options?|architectures?|schemas?|strategies)\\b"
        - "^\\s*i(?:'m| am)\\s+thinking\\s+about\\s+(?:re)?designing(?![._/])\\b\\s+(?:the\\s+|a\\s+|an\\s+|our\\s+)?(?:gate|classifier|schema|architecture|system|layer|workflow|ledger|phase|milestone)\\b"
        - "^\\s*what\\s+if\\s+we\\s+(?:replaced|replace|rewrote|rewrite|split|merged|merge)\\s+(?:the\\s+|a\\s+|an\\s+|our\\s+)?(?:classifier|architecture|system|schema|layer|workflow|gate|ledger|phase|milestone)\\b"
        - "^\\s*should\\s+we\\s+split\\s+this\\s+into\\s+(?:two|three|[0-9]+)\\s+phases?\\b"
        - "\\bcan\\s+you\\s+plan\\s+(?:the\\s+)?(?:next\\s+)?phase\\b(?:[^\\r\\n]{0,120}\\bimplementation\\s+plan\\b)?"
        - "^\\s*design(?![._/])\\b\\s+(?:the\\s+|a\\s+|an\\s+|our\\s+)?(?:schema|architecture|api|interface|workflow|migration|retry|cache|gate|evidence|ledger|classifier|system|layer)\\b"
        - "^\\s*evaluate(?![._/])\\b\\s+(?:the\\s+)?(?:tradeoffs?|trade-offs?)\\s+between\\s+\\w+\\s+and\\s+\\w+\\b"
        - "^\\s*should\\s+we\\s+(?:choose|adopt|standardize|centralize|decentralize)\\b[^\\r\\n]{0,120}\\b(?:architecture|design|system|schema|approach|strategy|layer)\\b"
        - "\\b(?:plan|planning)\\b[^\\r\\n]{0,120}\\b(?:phase|implementation\\s+plan|approach|approaches|next)\\b"
        - "\\b(?:phase|implementation\\s+plan|approach|approaches|next)\\b[^\\r\\n]{0,120}\\b(?:plan|planning)\\b"
    predicate:
      exclude_phrases:
        - "build this now"
        - "ship it"
        - "fix the bug"
        - "run /sgsd-orchestrate"
        - "implement this"
        - "make the change"
    enforcement:
      kind: directive
      directive: "/sgsd-triage"

  - id: quality-gate-missing-plan
    trigger:
      hook_event_name: PostToolUse
      tool_names:
        - Edit
        - Write
        - NotebookEdit
    predicate:
      active_phase_plan_locked: missing
    enforcement:
      kind: report_only
      signal: missing_plan

  - id: kb-lookup-triage
    trigger:
      strong_kb_phrases:
        - "last meeting with"
        - "knowledge base"
      strong_kb_regexes:
        - "what did .+ (say|think|mean|decide)"
        - "(the|my|our|last|latest|recent) meeting (with|about|on)"
        - "look at .*(meeting|call|corpus|transcript|knowledge base|kb)\\b"
        - "import .*(meeting|transcript|recording|brief)"
        - "\\b(jcl|clarity)\\b .*(meeting|note|record|corpus)"
      phrases:
        - "meeting"
        - "corpus"
      regexes:
        - "\\bmeetings?\\b"
    predicate:
      exclude_start_verbs:
        - "build"
        - "fix"
        - "run"
        - "test"
        - "file"
    enforcement:
      kind: shadow
      signal: kb_triage_shadow

  - id: erp-resolve-shadow
    availability: external-if-installed
    trigger:
      strong_regexes:
        - '\b(?:resolve|reconcile)\b(?=[^\r\n]{0,120}\b(?:erp|sap)\b)(?=[^\r\n]{0,120}\b(?:customer|vendor|material|order|record)\b)'
      regexes:
        - '^\s*(?:build|fix|run|test|file)\b(?=[^\r\n]{0,120}\b(?:erp|sap)\b)(?=[^\r\n]{0,120}\b(?:customer|vendor|material|order|record)\b)'
    predicate:
      exclude_start_verbs:
        - build
        - fix
        - run
        - test
        - file
        - export
    enforcement:
      kind: shadow
      signal: kb_triage_shadow
      target_skill: erp-resolve
      soft_path_action: would_route_erp_resolve

  - id: clarity-engines-shadow
    availability: external-if-installed
    trigger:
      strong_regexes:
        - '\b(?:query|search|compare)\b(?=[^\r\n]{0,120}\b(?:clarity|rag)\b)(?=[^\r\n]{0,120}\b(?:engine|index|retrieval)\b)'
      regexes:
        - '^\s*(?:build|fix|run|test|file)\b(?=[^\r\n]{0,120}\b(?:clarity|rag)\b)(?=[^\r\n]{0,120}\b(?:engine|index|retrieval)\b)'
    predicate:
      exclude_start_verbs:
        - build
        - fix
        - run
        - test
        - file
    enforcement:
      kind: shadow
      signal: kb_triage_shadow
      target_skill: clarity-engines
      soft_path_action: would_route_clarity_engines

  - id: vtp-route-and-retrieve-shadow
    availability: mcp-server-registered
    trigger:
      strong_regexes:
        - '\b(?:route\s+and\s+retrieve|end[- ]to[- ]end)\b(?=[^\r\n]{0,180}\b(?:intent|retrieval|knowledge|evidence|context)\b)'
    enforcement:
      kind: shadow
      signal: kb_triage_shadow
      surface_id: vtp_route_and_retrieve
      soft_path_action: would_route_vtp_route_and_retrieve

  - id: vtp-triage-advisory-shadow
    availability: mcp-server-registered
    trigger:
      strong_regexes:
        - '\b(?:assess|return|produce|request|review)\b(?=[^\r\n]{0,180}\btriage\b)(?=[^\r\n]{0,180}\b(?:verdict|advisory|decision)\b)'
    enforcement:
      kind: shadow
      signal: kb_triage_shadow
      surface_id: vtp_triage
      soft_path_action: would_route_vtp_triage_advisory

  - id: vtp-search-substrate-shadow
    availability: mcp-server-registered
    trigger:
      strong_regexes:
        - '\b(?:search|find|retrieve|query|look\s+up)\b(?=[^\r\n]{0,180}\b(?:books?|papers?|transcripts?)\b)(?=[^\r\n]{0,180}\b(?:content|passage|chapter|excerpt|text|evidence)\b)'
    predicate:
      exclude_regexes:
        - '\b(?:end[- ]to[- ]end|route\s+and\s+retrieve|triage\s+verdict|meeting\s+export|export)\b'
    enforcement:
      kind: shadow
      signal: kb_triage_shadow
      surface_id: vtp_search_substrate
      soft_path_action: would_route_vtp_search_substrate

  - id: vtp-wiki-search-shadow
    availability: mcp-server-registered
    trigger:
      strong_regexes:
        - '\b(?:search|find|retrieve|query|look\s+up)\b(?=[^\r\n]{0,180}\b(?:people|person|projects?|ideas?|analys(?:is|es))\b)(?=[^\r\n]{0,180}\b(?:wiki|profile|page|context|evidence)\b)'
    predicate:
      exclude_regexes:
        - '\b(?:end[- ]to[- ]end|route\s+and\s+retrieve|triage\s+verdict|meeting\s+export|export)\b'
    enforcement:
      kind: shadow
      signal: kb_triage_shadow
      surface_id: wiki_search
      soft_path_action: would_route_wiki_search
