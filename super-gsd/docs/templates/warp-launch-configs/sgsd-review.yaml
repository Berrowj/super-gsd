# =============================================================================
# SGSD Review — Warp Launch Configuration
#
# 3-pane workspace for reviewing the latest phase before merging or signing off:
#   - Top:    git log + diff of latest phase commits
#   - Middle: ATC-REVIEW + VERIFICATION + WASTE artifacts of active phase
#   - Bottom: free shell for code-review commands
#
# Pairs with SGSD: Open Review Artifacts and SGSD: Gate Status workflows.
#
# INSTALL:
#   1. Copy to $HOME\.warp\launch_configurations\sgsd-review.yaml
#   2. Command Palette (Ctrl+Shift+P) → "Launch Configuration: SGSD Review"
# =============================================================================

---
name: SGSD Review
windows:
  - tabs:
      - title: "🔍 Review"
        color: blue
        layout:
          cwd: C:\Users\jack.berrow\GSDedits
          commands:
            - exec: powershell -NoExit -Command ". $PROFILE; Write-Host 'Recent commits:' -ForegroundColor Green; git log --oneline -10"
        split_direction: horizontal
        panes:
          - cwd: C:\Users\jack.berrow\GSDedits
            commands:
              - exec: powershell -NoExit -Command ". $PROFILE; Write-Host 'Open SGSD: Open Review Artifacts (Ctrl+Shift+P) for ATC + Verification + Waste of active phase' -ForegroundColor Green"
          - cwd: C:\Users\jack.berrow\GSDedits
            commands:
              - exec: powershell -NoExit -Command ". $PROFILE; Write-Host 'Free shell. Try: gh pr list | gh pr view | git diff master..HEAD' -ForegroundColor Cyan"
