# =============================================================================
# SGSD Cockpit Only - Warp Launch Configuration Template
#
# Phase 78-01 deliverable. Lighter-weight workspace: just the 3 cockpit
# panes (mission-control / narrative / codex-monitor) + a shell. No
# Claude session.
#
# INSTALL:
#   1. Copy to $HOME\.warp\launch_configurations\sgsd-cockpit-only.yaml
#      AND %APPDATA%\warp\Warp\data\launch_configurations\ on Windows.
#   2. Open via Command Palette: "Launch Configuration: SGSD Cockpit Only"
#
# CAVEAT: opens in a NEW Warp window per Phase 63 M4 finding.
#
# Init pattern: each pane calls sgsd-tab-init.ps1 (or sgsd-profile-extensions.ps1
# for non-tab panes). This replaces the legacy `. $PROFILE` pattern which broke
# on machines whose $PROFILE resolves under OneDrive (path-with-spaces). The
# main cockpit pane additionally gets the live tab-title watcher (Role=cockpit).
# =============================================================================

---
name: SGSD Cockpit Only
windows:
  - tabs:
      - title: "Cockpit"
        color: yellow
        layout:
          cwd: C:\Users\jack.berrow\GSDedits
          commands:
            - exec: |-
                powershell -NoExit -NoProfile -ExecutionPolicy Bypass -Command "& 'C:\Users\jack.berrow\GSDedits\super-gsd\scripts\lib\sgsd-tab-init.ps1' -Role 'cockpit' -ProjectDir 'C:\Users\jack.berrow\GSDedits'; sgsd"
        split_direction: vertical
        panes:
          - cwd: C:\Users\jack.berrow\GSDedits
            commands:
              - exec: |-
                  powershell -NoExit -NoProfile -ExecutionPolicy Bypass -Command "& 'C:\Users\jack.berrow\GSDedits\super-gsd\scripts\sgsd-profile-extensions.ps1'; Write-Host 'Narrative pane. Will populate when SGSD is active.' -ForegroundColor Cyan"
          - cwd: C:\Users\jack.berrow\GSDedits
            commands:
              - exec: |-
                  powershell -NoExit -NoProfile -ExecutionPolicy Bypass -Command "& 'C:\Users\jack.berrow\GSDedits\super-gsd\scripts\sgsd-profile-extensions.ps1'; Write-Host 'Codex/Gate monitor pane. Try: SGSD: Codex Status from Command Search.' -ForegroundColor Cyan"
      - title: "Shell"
        color: yellow
        layout:
          cwd: C:\Users\jack.berrow\GSDedits
          commands:
            - exec: |-
                powershell -NoExit -NoProfile -ExecutionPolicy Bypass -Command "& 'C:\Users\jack.berrow\GSDedits\super-gsd\scripts\sgsd-profile-extensions.ps1'"