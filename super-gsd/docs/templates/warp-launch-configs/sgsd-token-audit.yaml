# =============================================================================
# SGSD Token Audit — Warp Launch Configuration
#
# 3-pane workspace for investigating token spend / waste:
#   - Top:    token attribution by role/phase
#   - Middle: waste-status feed (degraded/warn/ok)
#   - Bottom: free shell for /sgsd-token-audit and ad-hoc queries
#
# Pairs with the SGSD: Token Summary workflow.
#
# INSTALL:
#   1. Copy to $HOME\.warp\launch_configurations\sgsd-token-audit.yaml
#   2. Command Palette (Ctrl+Shift+P) → "Launch Configuration: SGSD Token Audit"
# =============================================================================

---
name: SGSD Token Audit
windows:
  - tabs:
      - title: "💰 Token Audit"
        color: yellow
        layout:
          cwd: C:\Users\jack.berrow\GSDedits
          commands:
            - exec: powershell -NoExit -Command ". $PROFILE; Write-Host 'Token attribution (refresh on demand):' -ForegroundColor Yellow; node super-gsd/tools/token-attribution/report.cjs .planning 2>$null | Select-String -Pattern 'role|phase|total|cost' | Select-Object -First 30"
        split_direction: horizontal
        panes:
          - cwd: C:\Users\jack.berrow\GSDedits
            commands:
              - exec: powershell -NoExit -Command ". $PROFILE; Write-Host 'token-waste-status tail (last 10):' -ForegroundColor Yellow; Get-Content .planning\metrics\token-waste-status.jsonl -Tail 10 -Encoding UTF8 2>$null"
          - cwd: C:\Users\jack.berrow\GSDedits
            commands:
              - exec: powershell -NoExit -Command ". $PROFILE; Write-Host 'Free shell. Try: /sgsd-token-audit --quick (in Claude) | SGSD: Token Summary (workflow)' -ForegroundColor Cyan"
